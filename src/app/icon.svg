<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Brutalist Offset Shadow -->
  <rect x="25" y="25" width="70" height="70" fill="#111111" />
  
  <!-- Main White Container -->
  <rect x="5" y="5" width="70" height="70" fill="#ffffff" stroke="#111111" stroke-width="6" stroke-linejoin="miter" />
  
  <!-- Top Left Pixel (The top of the P's stem in solid black) -->
  <rect x="15" y="15" width="22" height="22" fill="#111111" />
  
  <!-- Bottom Left Pixel (The bottom of the P's stem in Safety Orange with border) -->
  <rect x="15" y="43" width="22" height="22" fill="#FF5500" stroke="#111111" stroke-width="4" stroke-linejoin="miter" />
  
  <!-- Top Right Pixel (The loop of the P in Safety Orange with border) -->
  <rect x="43" y="15" width="22" height="22" fill="#FF5500" stroke="#111111" stroke-width="4" stroke-linejoin="miter" />
</svg>
